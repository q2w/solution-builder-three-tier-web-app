server {
    listen 80;
    server_name example.com;
    root /usr/share/nginx/html;

    location / {
        # First, try to serve the file or directory directly
        try_files $uri $uri/ @rewrite;
    }

    # If the file doesn't exist, rewrite the request
    location @rewrite {
        # Rewrite the URL by stripping the first parameter
        rewrite ^/([^/]+)(.*)$ /$2 last;

        # Serve the rewritten URL, if it's found
        try_files $uri $uri/ /index.html;
    }
}
